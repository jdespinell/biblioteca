[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biblioteca-backend"
version = "1.0.0"
description = "Biblioteca SaaS PWA — FastAPI Backend"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    # Pydantic / Settings
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Authentication
    "bcrypt>=4.0.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # File uploads
    "python-multipart>=0.0.9",
    # HTTP client (ISBN lookup, Gemini fallback)
    "httpx>=0.27.0",
    # Google Gemini AI
    "google-generativeai>=0.7.0",
    # Object storage (MinIO/S3)
    "boto3>=1.34.0",
    # Email validation
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
